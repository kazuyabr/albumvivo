services:
  app:
    build: .
    ports:
      - "8090:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "1"
      APP_URL: http://localhost:8090
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: freebuff
      DB_USER: freebuff
      DB_PASS: freebuff
      AI_PROVIDER: mock
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /var/www/html/storage/uploads
      MP_ENV: test
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: freebuff
      MARIADB_USER: freebuff
      MARIADB_PASSWORD: freebuff
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Espelha o Cloudflare R2 (S3 de compatível) para testar o driver de storage
  # sem depender de conta externa. Opt-in: `docker compose --profile storage up -d`
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: freebuff
      MINIO_ROOT_PASSWORD: freebuff123
    ports:
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
  miniodata:
